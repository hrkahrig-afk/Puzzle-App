<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Puzzle Box</title>
  <meta name="description" content="Daily word, sudoku and crossword puzzles.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // apply theme before first paint
    try {
      var s = JSON.parse(localStorage.getItem('pz:settings') || '{}');
      if (s.theme && s.theme !== 'system') document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="backBtn" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <h1 class="topbar-title" id="title">Puzzle Box</h1>
      <div class="topbar-actions" id="actions"></div>
    </header>
    <main id="view"></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
