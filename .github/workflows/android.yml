name: Android app

# Builds the Puzzle Box Android app. The app loads the live site, so game
# updates don't need a new APK; this only runs when the app shell changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor
        working-directory: android-app
        run: npm ci && npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_B64 secret yet: building a test version only (not published)."
          fi

      - name: Build
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi

      - name: Publish release
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/release/app-release.apk PuzzleBox.apk
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest PuzzleBox.apk \
            --title "Puzzle Box for Android (build ${{ github.run_number }})" \
            --notes "Download PuzzleBox.apk on your phone and open it to install. Installing over an older version keeps your saves." \
            --latest

      - name: Keep test build
        if: env.SIGNED != '1'
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleBox-test
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
